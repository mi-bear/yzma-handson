name: Go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: example/go.mod
          cache-dependency-path: example/go.sum

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt が必要なファイル:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (integration build tag)
        run: go vet -tags integration ./...

      - name: go test
        run: go test -count=1 ./...

      - name: modernize
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest -test ./...
